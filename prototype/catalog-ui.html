<!doctype html>
<!-- Three graphical catalog variants, switchable via ?variant=A|B|C, on a throwaway standalone prototype page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Harness Dashboard — graphical prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #11151a;
      --panel-2: #171c22;
      --line: #27303a;
      --muted: #8d99a7;
      --text: #eef2f6;
      --accent: #9cf2c8;
      --accent-2: #92b9ff;
      --warning: #f7c873;
      --danger: #ff8c8c;
      --radius: 14px;
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; }
    button, select { color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent-2); outline-offset: 2px;
    }
    .app { min-height: 100vh; padding-bottom: 96px; }
    .topbar {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      gap: 20px; padding: 0 22px; border-bottom: 1px solid var(--line); background: rgba(11,13,16,.92);
      position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: max-content; }
    .mark { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: #102219; font-weight: 900; }
    .brand strong { letter-spacing: -.02em; }
    .local-badge, .pill, .tag, .count {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
      padding: 4px 9px; color: var(--muted); background: var(--panel);
    }
    .local-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .ghost, .primary, .icon-button {
      border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 8px 11px;
    }
    .primary { background: var(--accent); border-color: var(--accent); color: #102219; font-weight: 750; }
    .icon-button { padding: 7px 10px; }
    .search {
      display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 11px;
      background: var(--panel); padding: 0 12px; min-height: 42px;
    }
    .search:focus-within { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(146,185,255,.12); }
    .search input { width: 100%; color: var(--text); background: transparent; border: 0; outline: 0; }
    .search kbd { color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 11px; }
    .muted { color: var(--muted); }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 28px; letter-spacing: -.04em; }
    h2 { font-size: 19px; letter-spacing: -.025em; }
    h3 { font-size: 14px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .filter-button {
      width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px;
      border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 8px 9px; text-align: left;
    }
    .filter-button:hover, .filter-button.active { background: var(--panel-2); color: var(--text); }
    .filter-button.active { box-shadow: inset 3px 0 var(--accent); }
    .family-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; background: var(--accent-2); }
    .family-dot.Agent { background: #dd9cff; }
    .family-dot.Rule { background: var(--warning); }
    .family-dot.Prompt { background: #ff9faf; }
    .asset-row {
      display: grid; gap: 7px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent;
      color: inherit; text-align: left; padding: 14px 15px;
    }
    .asset-row:hover, .asset-row.selected { background: var(--panel-2); }
    .asset-row.selected { box-shadow: inset 3px 0 var(--accent); }
    .asset-row-top { display: flex; justify-content: space-between; gap: 12px; }
    .asset-row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .asset-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .detail { padding: 22px; overflow: auto; }
    .detail-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .detail-actions { display: flex; gap: 7px; flex-wrap: wrap; margin: 18px 0; }
    .path { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--line); border-radius: 8px; background: #090b0d; padding: 9px 11px; color: #bed3e8; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .detail-section { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 18px; }
    .placement {
      border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 9px; background: var(--panel-2);
    }
    .placement-head { display: flex; justify-content: space-between; gap: 10px; }
    .status { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
    .status.shadowed { color: var(--warning); }
    .status.unknown { color: var(--muted); }
    .compat-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(145px,1fr)); gap: 8px; }
    .compat { border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
    .compat small { color: var(--muted); display: block; }
    .problem { border: 1px solid rgba(247,200,115,.35); background: rgba(247,200,115,.08); color: #ffe2a9; border-radius: 10px; padding: 11px 13px; }

    /* Variant A: explorer */
    .explorer { display: grid; grid-template-columns: 210px minmax(300px, 390px) minmax(420px, 1fr); height: calc(100vh - 64px - 96px); min-height: 610px; }
    .explorer > * { min-width: 0; border-right: 1px solid var(--line); }
    .sidebar { padding: 18px 14px; overflow: auto; background: #0e1115; }
    .sidebar h3 { margin: 22px 8px 8px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .09em; }
    .results { min-width: 0; overflow: auto; background: var(--panel); }
    .results-head { position: sticky; top: 0; z-index: 2; padding: 14px; background: var(--panel); border-bottom: 1px solid var(--line); }

    /* Variant B: search desk */
    .search-desk { max-width: 1320px; margin: 0 auto; padding: 38px 28px; }
    .search-hero { max-width: 800px; margin-bottom: 28px; }
    .search-hero .search { min-height: 54px; font-size: 16px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 6px 11px; }
    .chip.active { border-color: var(--accent); color: var(--accent); }
    .desk-grid { display: grid; grid-template-columns: minmax(550px, 1.35fr) minmax(350px, .65fr); gap: 22px; align-items: start; }
    .table-wrap, .desk-detail { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
    table { width: 100%; border-collapse: collapse; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; text-align: left; padding: 11px 13px; border-bottom: 1px solid var(--line); }
    td { padding: 13px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr { cursor: pointer; }
    tbody tr:hover, tbody tr.selected { background: var(--panel-2); }
    .desk-detail { position: sticky; top: 86px; max-height: calc(100vh - 118px); overflow: auto; }

    /* Variant C: harness matrix */
    .matrix-page { padding: 28px; max-width: 1500px; margin: 0 auto; }
    .matrix-intro { display: flex; align-items: end; justify-content: space-between; gap: 22px; margin-bottom: 20px; }
    .matrix-intro .search { width: min(520px, 50vw); }
    .matrix-shell { border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; background: var(--panel); }
    .matrix { min-width: 940px; }
    .matrix-row { display: grid; grid-template-columns: 270px repeat(6, minmax(100px,1fr)); border-bottom: 1px solid var(--line); }
    .matrix-row > div, .matrix-row > button { min-width: 0; padding: 12px; border: 0; border-right: 1px solid var(--line); background: transparent; color: inherit; text-align: left; }
    .matrix-header { position: sticky; top: 0; z-index: 4; background: #151a20; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .matrix-asset { cursor: pointer; }
    .matrix-asset:hover, .matrix-row.selected > * { background: var(--panel-2); }
    .matrix-cell { display: grid; place-items: center; text-align: center !important; }
    .matrix-mark { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 7px; background: rgba(156,242,200,.12); color: var(--accent); font-weight: 900; }
    .matrix-mark.none { background: transparent; color: #424b55; }
    .matrix-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
    .matrix-detail > section { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 18px; }

    .prototype-state {
      position: fixed; left: 16px; bottom: 18px; z-index: 30; border: 1px solid var(--line); background: rgba(17,21,26,.94);
      color: var(--muted); border-radius: 10px; padding: 8px 10px; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .switcher {
      position: fixed; z-index: 40; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
      border: 1px solid #506073; border-radius: 999px; background: #eef2f6; color: #12161b; padding: 6px; box-shadow: 0 16px 45px rgba(0,0,0,.45);
    }
    .switcher button { border: 0; background: transparent; color: inherit; border-radius: 999px; min-width: 34px; height: 34px; }
    .switcher button:hover { background: #dbe3eb; }
    .switcher strong { min-width: 190px; text-align: center; font-size: 12px; }
    .toast { position: fixed; right: 18px; bottom: 24px; z-index: 50; background: var(--accent); color: #102219; font-weight: 750; border-radius: 9px; padding: 10px 13px; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    @media (max-width: 980px) {
      .explorer { grid-template-columns: 180px 1fr; height: auto; }
      .explorer .detail { grid-column: 1 / -1; border-top: 1px solid var(--line); }
      .desk-grid { grid-template-columns: 1fr; }
      .desk-detail { position: static; max-height: none; }
      .matrix-detail { grid-template-columns: 1fr; }
      .local-badge { display: none; }
    }
    @media (max-width: 680px) {
      .topbar { padding: 0 12px; }
      .top-actions .ghost { display: none; }
      .explorer { display: block; }
      .sidebar { border-bottom: 1px solid var(--line); }
      .search-desk, .matrix-page { padding: 20px 12px; }
      .table-wrap { overflow-x: auto; }
      .matrix-intro { align-items: stretch; flex-direction: column; }
      .matrix-intro .search { width: 100%; }
      .prototype-state { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="live" aria-live="polite"></div>
  <script>
    const assets = [
      {
        id: 'agents-md', name: 'AGENTS.md', family: 'Rule', nativeType: 'Instructions',
        description: 'Shared repository guidance for coding agents, terminology, tracker conventions, and domain documentation.',
        path: '~/projects/ai-harness-dashboard/AGENTS.md', updated: '2 min ago', resources: 0,
        tags: ['portable', 'repository'],
        placements: [
          ['Pi CLI', 'project', 'active', '. / AGENTS.md'], ['Codex CLI', 'project', 'merged', '. / AGENTS.md'],
          ['Cursor IDE', 'project', 'active', '. / AGENTS.md'], ['Copilot CLI', 'project', 'unknown', '. / AGENTS.md']
        ],
        compatibility: [['Pi CLI','native'],['Codex CLI','native'],['Cursor IDE','native'],['Copilot CLI','native'],['Claude Code','extended']]
      },
      {
        id: 'research', name: 'research', family: 'Skill', nativeType: 'Agent Skill',
        description: 'Investigates a focused question against high-trust primary sources and leaves a cited brief.',
        path: '~/.agents/skills/research/SKILL.md', updated: '18 min ago', resources: 3,
        tags: ['portable', 'primary-sources'],
        placements: [
          ['Pi CLI', 'user', 'active', '~/.agents/skills/research'], ['Codex CLI', 'user', 'active', '~/.agents/skills/research'],
          ['Gemini CLI', 'user', 'active', '~/.agents/skills/research'], ['Cursor IDE', 'user', 'active', '~/.agents/skills/research']
        ],
        compatibility: [['Pi CLI','portable'],['Codex CLI','portable'],['Cursor IDE','portable'],['Gemini CLI','portable'],['Copilot CLI','portable']]
      },
      {
        id: 'security-review', name: 'security-reviewer', family: 'Agent', nativeType: 'Custom agent',
        description: 'Reviews changes for trust-boundary mistakes, secret exposure, and unsafe defaults.',
        path: '~/.claude/agents/security-reviewer.md', updated: 'Yesterday', resources: 0,
        tags: ['claude', 'security'],
        placements: [['Claude Code', 'user', 'active', '~/.claude/agents/security-reviewer.md']],
        compatibility: [['Claude Code','native'],['Copilot CLI','unknown'],['Gemini CLI','unknown']]
      },
      {
        id: 'review-prompt', name: 'review-changes', family: 'Prompt', nativeType: 'Prompt template',
        description: 'Reviews the working tree against repository standards and reports only actionable findings.',
        path: '~/.pi/agent/prompts/review-changes.md', updated: '3 days ago', resources: 0,
        tags: ['pi', 'review'],
        placements: [['Pi CLI', 'user', 'active', '~/.pi/agent/prompts/review-changes.md']],
        compatibility: [['Pi CLI','native'],['Claude Code','unsupported'],['Gemini CLI','extended']]
      },
      {
        id: 'cursor-rules', name: 'frontend-accessibility', family: 'Rule', nativeType: 'Cursor rule',
        description: 'Applies accessibility checks whenever files under the web interface are changed.',
        path: '~/work/acme/.cursor/rules/frontend-accessibility.mdc', updated: '5 days ago', resources: 0,
        tags: ['cursor', 'path-scoped'],
        placements: [['Cursor IDE', 'project', 'active', '.cursor/rules/frontend-accessibility.mdc']],
        compatibility: [['Cursor IDE','native'],['Copilot IDE','extended']]
      },
      {
        id: 'deploy-command', name: 'deploy:preview', family: 'Prompt', nativeType: 'Custom command',
        description: 'Prepares a preview deployment summary from the current repository state.',
        path: '~/work/acme/.gemini/commands/deploy/preview.toml', updated: '1 week ago', resources: 0,
        tags: ['gemini', 'command'],
        placements: [['Gemini CLI', 'project', 'active', '.gemini/commands/deploy/preview.toml']],
        compatibility: [['Gemini CLI','native'],['Pi CLI','unsupported']]
      },
      {
        id: 'duplicate-research', name: 'research', family: 'Skill', nativeType: 'Agent Skill',
        description: 'An older project-local research workflow that collides with the user-level skill.',
        path: '~/work/legacy/.claude/skills/research/SKILL.md', updated: '2 months ago', resources: 1,
        tags: ['collision', 'project'],
        placements: [['Claude Code', 'project', 'shadowed', '.claude/skills/research']],
        compatibility: [['Claude Code','extended'],['Pi CLI','portable']]
      }
    ];

    const harnesses = ['Pi CLI', 'Claude Code', 'Codex CLI', 'Cursor IDE', 'Copilot CLI', 'Gemini CLI'];
    const variantNames = { A: 'Explorer', B: 'Search desk', C: 'Harness matrix' };
    const state = { variant: getVariant(), query: '', family: 'All', harness: 'All', selected: 'agents-md' };

    function getVariant() {
      const value = new URLSearchParams(location.search).get('variant')?.toUpperCase();
      return ['A','B','C'].includes(value) ? value : 'A';
    }
    function filteredAssets() {
      const q = state.query.trim().toLowerCase();
      return assets.filter(asset => {
        const text = [asset.name, asset.family, asset.nativeType, asset.description, asset.path, ...asset.tags, ...asset.placements.flat()].join(' ').toLowerCase();
        return (!q || text.includes(q)) &&
          (state.family === 'All' || asset.family === state.family) &&
          (state.harness === 'All' || asset.placements.some(p => p[0] === state.harness));
      });
    }
    function selectedAsset() {
      const visible = filteredAssets();
      return visible.find(a => a.id === state.selected) || visible[0] || assets[0];
    }
    function setVariant(next) {
      state.variant = next;
      const url = new URL(location.href); url.searchParams.set('variant', next); history.replaceState({}, '', url);
      render(); announce(`Variant ${next}: ${variantNames[next]}`);
    }
    function cycleVariant(direction) {
      const keys = ['A','B','C']; const index = keys.indexOf(state.variant);
      setVariant(keys[(index + direction + keys.length) % keys.length]);
    }
    function setFamily(value) { state.family = value; render(); }
    function setHarness(value) { state.harness = value; render(); }
    function selectAsset(id) { state.selected = id; render(); }
    function updateQuery(value) { state.query = value; render(false); }
    function announce(message) {
      const live = document.getElementById('live'); live.innerHTML = `<div class="toast">${escapeHtml(message)}</div>`;
      clearTimeout(announce.timer); announce.timer = setTimeout(() => live.innerHTML = '', 1800);
    }
    function action(name, asset) {
      if (name === 'Copy path' && navigator.clipboard) navigator.clipboard.writeText(asset.path).catch(() => {});
      announce(`${name}: ${asset.name} (prototype only)`);
    }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function familyLabel(asset) { return `<span><span class="family-dot ${asset.family}"></span>${asset.family}</span>`; }
    function topbar() {
      return `<header class="topbar">
        <div class="brand"><span class="mark">A</span><strong>AI Harness Dashboard</strong><span class="local-badge">Local only</span></div>
        <div class="top-actions"><button class="ghost" onclick="announce('7 assets · 17 placements · scanned just now')">Scan summary</button><button class="primary" onclick="announce('Rescan started (prototype only)')">↻ Rescan</button></div>
      </header>`;
    }
    function searchBox(label = 'Search assets, paths, and harnesses') {
      return `<label class="search"><span aria-hidden="true">⌕</span><span class="muted" style="position:absolute;left:-9999px">${label}</span><input value="${escapeHtml(state.query)}" oninput="updateQuery(this.value)" placeholder="${label}" aria-label="${label}"><kbd>⌘K</kbd></label>`;
    }
    function filterButtons(type) {
      const values = type === 'family' ? ['All','Skill','Agent','Rule','Prompt'] : ['All',...harnesses];
      return values.map(value => {
        const current = type === 'family' ? state.family : state.harness;
        const count = value === 'All' ? assets.length : assets.filter(a => type === 'family' ? a.family === value : a.placements.some(p => p[0] === value)).length;
        return `<button class="filter-button ${current === value ? 'active' : ''}" onclick="${type === 'family' ? 'setFamily' : 'setHarness'}('${value}')"><span>${value}</span><span class="count">${count}</span></button>`;
      }).join('');
    }
    function assetRows() {
      return filteredAssets().map(asset => `<button class="asset-row ${selectedAsset().id === asset.id ? 'selected' : ''}" onclick="selectAsset('${asset.id}')">
        <span class="asset-row-top"><strong>${escapeHtml(asset.name)}</strong><span class="pill">${asset.placements.length} place${asset.placements.length === 1 ? '' : 's'}</span></span>
        <span class="muted">${escapeHtml(asset.description)}</span>
        <span class="asset-meta">${familyLabel(asset)} · ${escapeHtml(asset.nativeType)} · ${escapeHtml(asset.updated)}</span>
      </button>`).join('') || `<p class="muted" style="padding:24px">No assets match these filters.</p>`;
    }
    function detail(asset, compact = false) {
      return `<article class="detail">
        <div class="detail-head"><div><div class="eyebrow">${asset.family} · ${escapeHtml(asset.nativeType)}</div><h1>${escapeHtml(asset.name)}</h1><p class="muted">${escapeHtml(asset.description)}</p></div><span class="pill">${asset.tags.map(escapeHtml).join(' · ')}</span></div>
        <code class="path" title="${escapeHtml(asset.path)}">${escapeHtml(asset.path)}</code>
        <div class="detail-actions"><button class="primary" onclick="action('Open in editor', selectedAsset())">Open in editor</button><button class="ghost" onclick="action('Reveal', selectedAsset())">Reveal</button><button class="ghost" onclick="action('Copy path', selectedAsset())">Copy path</button></div>
        <section class="detail-section"><div class="section-title"><h2>Placements</h2><span class="count">${asset.placements.length}</span></div>
          ${asset.placements.map(p => `<div class="placement"><div class="placement-head"><strong>${escapeHtml(p[0])}</strong><span class="status ${p[2]}">${escapeHtml(p[2])}</span></div><div class="asset-meta">${escapeHtml(p[1])} scope · ${escapeHtml(p[3])}</div></div>`).join('')}
        </section>
        ${compact ? '' : `<section class="detail-section"><div class="section-title"><h2>Compatibility evidence</h2><span class="muted">Not inferred</span></div><div class="compat-grid">${asset.compatibility.map(c => `<div class="compat"><strong>${escapeHtml(c[0])}</strong><small>${escapeHtml(c[1])}</small></div>`).join('')}</div></section>`}
      </article>`;
    }
    function variantA() {
      return `<main class="explorer">
        <aside class="sidebar"><div class="eyebrow">Browse</div><h3>Asset family</h3>${filterButtons('family')}<h3>Harness surface</h3>${filterButtons('harness')}<h3>Discovery</h3><div class="problem">1 unreadable entry<br><small>Review discovery problems</small></div></aside>
        <section class="results"><div class="results-head">${searchBox()}<div class="asset-meta" style="margin-top:9px">${filteredAssets().length} results · startup snapshot</div></div>${assetRows()}</section>
        ${detail(selectedAsset())}
      </main>`;
    }
    function chips(type) {
      const values = type === 'family' ? ['All','Skill','Agent','Rule','Prompt'] : ['All',...harnesses];
      const current = type === 'family' ? state.family : state.harness;
      return values.map(v => `<button class="chip ${current === v ? 'active' : ''}" onclick="${type === 'family' ? 'setFamily' : 'setHarness'}('${v}')">${v}</button>`).join('');
    }
    function variantB() {
      const rows = filteredAssets().map(a => `<tr class="${selectedAsset().id === a.id ? 'selected' : ''}" data-id="${a.id}" onclick="selectAsset('${a.id}')" tabindex="0"><td><strong>${escapeHtml(a.name)}</strong><div class="muted">${escapeHtml(a.description)}</div></td><td>${familyLabel(a)}</td><td>${a.placements.map(p => escapeHtml(p[0])).join('<br>')}</td><td>${escapeHtml(a.updated)}</td></tr>`).join('');
      return `<main class="search-desk"><section class="search-hero"><div class="eyebrow">Search desk</div><h1>Find any local AI asset</h1>${searchBox('Search name, content, path, or harness…')}<div class="chip-row">${chips('family')}</div><div class="chip-row">${chips('harness')}</div></section>
        <div class="desk-grid"><section class="table-wrap"><div class="section-title" style="padding:14px 14px 0"><h2>${filteredAssets().length} matching assets</h2><button class="ghost" onclick="announce('Sorted by relevance')">Relevance ↕</button></div><table><thead><tr><th>Asset</th><th>Family</th><th>Found in</th><th>Updated</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">No matches</td></tr>'}</tbody></table></section><aside class="desk-detail">${detail(selectedAsset(), true)}</aside></div>
      </main>`;
    }
    function matrixMark(asset, harness) {
      const placement = asset.placements.find(p => p[0] === harness);
      if (!placement) return `<span class="matrix-mark none">—</span>`;
      return `<span class="matrix-mark" title="${escapeHtml(placement[2])}">${placement[2] === 'shadowed' ? '◐' : placement[2] === 'unknown' ? '?' : '✓'}</span>`;
    }
    function variantC() {
      const rows = filteredAssets().map(a => `<div class="matrix-row ${selectedAsset().id === a.id ? 'selected' : ''}"><button class="matrix-asset" onclick="selectAsset('${a.id}')"><strong>${escapeHtml(a.name)}</strong><div class="asset-meta">${familyLabel(a)}</div></button>${harnesses.map(h => `<div class="matrix-cell">${matrixMark(a,h)}</div>`).join('')}</div>`).join('');
      const asset = selectedAsset();
      return `<main class="matrix-page"><div class="matrix-intro"><div><div class="eyebrow">Placement map</div><h1>Where your assets actually live</h1><p class="muted">Compare discovery and resolution state across harness surfaces.</p></div>${searchBox('Filter the placement map…')}</div><div class="chip-row" style="margin-bottom:16px">${chips('family')}</div>
        <section class="matrix-shell"><div class="matrix"><div class="matrix-row matrix-header"><div>AI Asset</div>${harnesses.map(h => `<div>${h.replace(' ','<br>')}</div>`).join('')}</div>${rows || '<p class="muted" style="padding:20px">No matching assets.</p>'}</div></section>
        <div class="matrix-detail"><section><div class="eyebrow">Selected asset</div><h2>${escapeHtml(asset.name)}</h2><p class="muted">${escapeHtml(asset.description)}</p><code class="path">${escapeHtml(asset.path)}</code><div class="detail-actions"><button class="primary" onclick="action('Open in editor', selectedAsset())">Open</button><button class="ghost" onclick="action('Reveal', selectedAsset())">Reveal</button></div></section><section><div class="section-title"><h2>Placement evidence</h2><span class="count">${asset.placements.length}</span></div>${asset.placements.map(p => `<div class="placement"><div class="placement-head"><strong>${escapeHtml(p[0])}</strong><span class="status ${p[2]}">${escapeHtml(p[2])}</span></div><div class="asset-meta">${escapeHtml(p[1])} · ${escapeHtml(p[3])}</div></div>`).join('')}</section></div>
      </main>`;
    }
    function switcher() {
      return `<nav class="switcher" aria-label="Prototype variants"><button onclick="cycleVariant(-1)" aria-label="Previous variant">←</button><strong>${state.variant} · ${variantNames[state.variant]}</strong><button onclick="cycleVariant(1)" aria-label="Next variant">→</button></nav>`;
    }
    function prototypeState() {
      return `<div class="prototype-state">variant=${state.variant} · query=${state.query || '∅'} · family=${state.family} · harness=${state.harness} · selected=${selectedAsset().id} · results=${filteredAssets().length}</div>`;
    }
    function render(refocus = true) {
      const active = document.activeElement;
      const cursor = active?.tagName === 'INPUT' ? active.selectionStart : null;
      document.getElementById('root').innerHTML = `<div class="app">${topbar()}${state.variant === 'A' ? variantA() : state.variant === 'B' ? variantB() : variantC()}${prototypeState()}${switcher()}</div>`;
      if (!refocus && cursor !== null) {
        const input = document.querySelector('.search input'); input?.focus(); input?.setSelectionRange(cursor, cursor);
      }
    }
    document.addEventListener('keydown', event => {
      const editing = event.target.matches('input, textarea, [contenteditable="true"]');
      if (!editing && event.key === 'ArrowLeft') { event.preventDefault(); cycleVariant(-1); }
      if (!editing && event.key === 'ArrowRight') { event.preventDefault(); cycleVariant(1); }
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); document.querySelector('.search input')?.focus(); }
      if (event.key === 'Enter' && event.target.matches('tbody tr')) selectAsset(event.target.dataset.id);
    });
    window.addEventListener('popstate', () => { state.variant = getVariant(); render(); });
    render();
  </script>
</body>
</html>
